<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BE000F">
<title>G&T S.R.L. — Consulta de Productos</title>

<style>
*{box-sizing:border-box}
:root{
  --rojo:#BE000F;
  --rojo2:#98000c;
  --gris:#f3f4f6;
  --gris2:#e5e7eb;
  --texto:#222;
  --muted:#6b7280;
  --verde:#176b2c;
  --azul:#183746;
  --dorado:#C58A22;
}

html,body{
  margin:0;
  padding:0;
  background:var(--gris);
  color:var(--texto);
  font-family:Arial,Helvetica,sans-serif
}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}

header{
  background:#fff;
  border-bottom:1px solid var(--gris2);
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

header img{
  width:150px;
  height:auto;
  display:block
}

.user-pill{
  font-size:13px;
  color:#555;
  background:#f7f7f7;
  border:1px solid #ddd;
  border-radius:20px;
  padding:8px 12px
}

.wrap{
  max-width:1050px;
  margin:24px auto;
  padding:0 15px 50px
}

.card{
  background:#fff;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.05)
}

.login-card{
  max-width:430px;
  margin:70px auto
}

.logo-login{
  width:190px;
  display:block;
  margin:0 auto 20px
}

h1{
  font-size:24px;
  margin:0 0 5px
}

h2{
  font-size:20px;
  margin:0
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:24px
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:0 0 6px
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #cfd2d7;
  border-radius:9px;
  background:#fff;
  outline:none
}

input:focus,select:focus{
  border-color:var(--rojo);
  box-shadow:0 0 0 3px rgba(190,0,15,.10)
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-weight:800;
  min-height:44px
}

.btn-primary{
  background:var(--rojo);
  color:#fff
}

.btn-primary:hover{background:var(--rojo2)}

.btn-large{
  width:100%;
  margin-top:16px
}

.status{
  margin-top:14px;
  padding:11px;
  border-radius:9px;
  font-size:14px;
  display:none
}

.status.error{
  display:block;
  background:#fff0f1;
  color:#9d0010;
  border:1px solid #f2b7bd
}

.status.ok{
  display:block;
  background:#edf8f0;
  color:var(--verde);
  border:1px solid #b9dfc2
}

.loading{
  text-align:center;
  padding:35px;
  color:#666
}

.catalog-header{
  text-align:center;
  margin-bottom:22px
}

.catalog-header h1{
  color:var(--azul);
  font-size:28px;
  font-weight:900;
  letter-spacing:.2px
}

.catalog-header .subtitle{
  margin:6px 0 0
}

.search-label{
  color:var(--azul);
  font-size:14px;
  margin-bottom:7px
}

.search-box{
  position:relative
}

.search-box input{
  padding-left:42px;
  font-size:15px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  pointer-events:none;
  font-size:18px
}

.resultados-titulo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:18px;
  margin-bottom:8px;
  color:var(--azul);
  font-weight:800;
  font-size:13px
}

.resultados-count{
  color:#777;
  font-weight:400
}

/* =========================================================
   ÁREA PRINCIPAL DE CONSULTA
   PC: dos módulos lado a lado
   CELULAR: módulos uno debajo del otro
   ========================================================= */

.consulta-grid{
  display:grid;
  grid-template-columns:minmax(0, 0.82fr) minmax(0, 1.18fr);
  gap:16px;
  align-items:stretch;
  width:100%;
}

.consulta-panel{
  background:#fff;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.05);
  min-width:0;
  overflow:hidden;
}

.resultados-titulo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:15px;
  margin-bottom:8px;
  color:var(--azul);
  font-weight:800;
  font-size:13px
}

.resultados-count{
  color:#777;
  font-weight:400
}

/* 4 filas visibles */
.catalogo-lista{
  display:flex;
  flex-direction:column;
  gap:5px;
  height:250px;
  overflow-y:auto;
  overflow-x:hidden;
  padding:1px 4px 1px 1px;
  border:1px solid var(--gris2);
  border-radius:10px;
  background:#fafafa
}

.catalogo-item{
  flex:0 0 57px;
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid #d9dce1;
  border-radius:8px;
  padding:8px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  transition:.15s
}

.catalogo-item:hover,
.catalogo-item:focus{
  border-color:var(--rojo);
  background:#fff7f7;
  outline:none
}

.catalogo-item-main{
  min-width:0
}

.catalogo-item strong{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.catalogo-item span{
  display:block;
  margin-top:3px;
  font-size:12px;
  color:#666;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.catalogo-item-id{
  display:none!important
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  padding:20px
}

/* =========================================================
   DETALLE
   ========================================================= */

.detalle-panel{
  min-height:100%
}

.detalle-placeholder{
  min-height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  padding:25px
}

.detalle-top{
  margin-bottom:15px
}

.detalle-cabecera{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:14px
}

.detalle-categoria{
  display:inline-block;
  flex:0 0 auto;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--rojo);
  background:#fff0f1;
  border:1px solid #f2b7bd;
  border-radius:20px;
  padding:5px 9px
}

.detalle-producto{
  color:var(--azul);
  font-size:22px;
  font-weight:900;
  line-height:1.15
}

.detalle-sub{
  margin-top:5px;
  color:#666;
  font-size:13px
}

.color-lista{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px
}

.color-tag{
  display:inline-block;
  background:#f3f4f6;
  border:1px solid #dfe2e5;
  border-radius:15px;
  padding:4px 8px;
  font-size:11px;
  color:#444
}

/* Tres precios en una fila */
.precios-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:14px;
  width:100%;
}

.dato{
  border:1px solid #e0e3e6;
  border-radius:9px;
  padding:9px 10px;
  background:#fafafa;
  min-width:0;
  overflow:hidden;
}

.dato-label{
  display:block;
  color:#777;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:4px
}

.dato-valor{
  display:block;
  color:#183746;
  font-size:14px;
  font-weight:800;
  line-height:1.25;
  overflow-wrap:anywhere
}

.dato-precio{
  background:#fff;
  border-top:3px solid #d9dee1
}

.dato-precio.oferta{
  background:#edf8f0;
  border-color:#b9dfc2
}

.dato-precio.oferta .dato-label,
.dato-precio.oferta .dato-valor{
  color:var(--verde)
}

.dato-precio.tarjeta{
  background:#f3f7fb;
  border-color:#cbdceb
}

.dato-precio.tarjeta .dato-label,
.dato-precio.tarjeta .dato-valor{
  color:#245a7a
}

/* Datos de caja */
.caja-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  margin-top:10px;
  padding:10px;
  background:#f7f8f9;
  border:1px solid #e1e4e7;
  border-radius:9px;
  width:100%;
}

.caja-dato{
  padding:0 10px;
  border-right:1px solid #dfe2e5
}

.caja-dato:first-child{
  padding-left:2px
}

.caja-dato:last-child{
  border-right:0;
  padding-right:2px
}

.caja-dato .dato-label{
  margin-bottom:3px
}

.caja-dato .dato-valor{
  font-size:13px
}

.nota{
  margin-top:10px;
  color:#777;
  font-size:11px;
  line-height:1.4
}

@media(min-width:901px){
  .detalle-panel{
    min-height:100%;
  }

  .detalle-panel .precios-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:900px){
  .consulta-grid{
    grid-template-columns:1fr;
  }

  .detalle-panel{
    min-height:auto
  }
}

@media(max-width:560px){
  .consulta-panel{
    padding:15px
  }

  .catalogo-lista{
    height:250px
  }

  .precios-grid{
    grid-template-columns:1fr
  }

  .caja-grid{
    grid-template-columns:1fr;
    gap:8px
  }

  .caja-dato{
    padding:0 0 8px;
    border-right:0;
    border-bottom:1px solid #dfe2e5
  }

  .caja-dato:last-child{
    padding-bottom:0;
    border-bottom:0
  }

  .detalle-cabecera{
    flex-direction:column
  }

  .detalle-producto{
    font-size:20px
  }
}

.oculto{display:none!important}

.spinner{
  width:30px;
  height:30px;
  margin:18px auto;
  border:4px solid #e5e7eb;
  border-top-color:var(--rojo);
  border-radius:50%;
  animation:spin .8s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(min-width:1000px){
  .wrap{max-width:1180px}
  .header-inner{max-width:1180px}
}

@media(max-width:560px){
  header{position:relative}
  .header-inner{
    align-items:flex-start
  }
  header img{width:125px}
  .user-pill{font-size:11px}
  .wrap{margin:12px auto}
  .card{
    padding:15px;
    border-radius:11px
  }
  .login-card{
    margin:35px auto
  }
  .catalog-header h1{
    font-size:23px
  }
  .catalogo-lista{
    height:250px
  }
  .detalle-grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycby_3DebaIbZZW2qZ7ShkePBD40Bzo8wGyaHAw8w0omsKahF6CpuUEEPaG2ox3fGkAqk0w/exec";

const LOGO_URL =
  "https://raw.githubusercontent.com/Jdequelli85/qr-corralon/main/logo.png";

let token = "";
let vendedor = "";
let catalogoProductos = [];
let catalogoOpciones = [];
let productoActual = null;

const $ = id => document.getElementById(id);

const esc = s =>
  String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

const numero = n =>
  Number(n || 0).toLocaleString("es-AR",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const numero0 = n =>
  Number(n || 0).toLocaleString("es-AR",{
    maximumFractionDigits:0
  });


function categoriaProducto(p){

  const id =
    String(p?.["ID"] || "")
      .trim()
      .toUpperCase();

  if(id.startsWith("CRRL-")) return "CRRL";
  if(id.startsWith("CER-")) return "CER";
  if(id.startsWith("POR-")) return "POR";
  if(id.startsWith("REV-")) return "REV";
  if(id.startsWith("PSO-")) return "PSO";

  return "OTRO";
}


function nombreCategoria(categoria){

  const nombres = {
    CRRL:"Material de corralón",
    CER:"Cerámico",
    POR:"Porcelanato",
    REV:"Revestimiento",
    PSO:"Piso",
    OTRO:"Producto"
  };

  return nombres[categoria] || "Producto";
}


function jsonp(params, timeoutMs=20000){

  return new Promise((resolve,reject)=>{

    const callback =
      "gtconsulta_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement("script");

    const q =
      new URLSearchParams({
        ...params,
        callback,
        _ts:Date.now()
      });

    let timer =
      setTimeout(()=>{

        cleanup();

        reject(
          new Error(
            "Tiempo de espera agotado."
          )
        );

      },timeoutMs);

    let terminado = false;

    function cleanup(){

      if(terminado)return;

      terminado=true;

      clearTimeout(timer);

      delete window[callback];

      script.remove();

    }

    window[callback] = data => {

      cleanup();

      resolve(data);

    };

    script.onerror = ()=>{

      cleanup();

      reject(
        new Error(
          "No se pudo conectar con el servidor."
        )
      );

    };

    script.src =
      API_URL + "?" + q.toString();

    document.body.appendChild(script);

  });
}


/* =========================================================
   LOGIN — VISUAL BASADO EN ppto.gytsrl.com
   ========================================================= */

function mostrarLogin(mensaje=""){

  document.title =
    "G&T S.R.L. — Consulta de Productos";

  $("app").innerHTML = `

    <main class="wrap">

      <section class="card login-card">

        <img
          class="logo-login"
          src="${LOGO_URL}"
          alt="G&T S.R.L."
        >

        <h1>Consulta de Productos</h1>

        <div class="subtitle">
          Acceso para personal autorizado
        </div>

        <form id="loginForm">

          <label>Vendedor</label>

          <select id="loginUsuario" required>

            <option value="">
              Seleccioná tu nombre
            </option>

            <option value="Agustin">Agustin</option>
            <option value="Gaston">Gaston</option>
            <option value="Tomito">Tomito</option>
            <option value="Julio">Julio</option>

          </select>

          <div style="height:12px"></div>

          <label>PIN</label>

          <input
            id="loginPin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            required
          >

          <button
            class="btn btn-primary btn-large"
            id="loginBtn"
          >
            INGRESAR
          </button>

          <div
            id="loginStatus"
            class="status ${mensaje ? "error" : ""}"
          >
            ${esc(mensaje)}
          </div>

        </form>

        <div
          style="
            margin-top:22px;
            text-align:center;
            color:#888;
            font-size:12px
          "
        >
          G&T S.R.L. · Consulta de Productos
        </div>

      </section>

    </main>
  `;


  $("loginForm").onsubmit = async e => {

    e.preventDefault();

    const btn = $("loginBtn");
    const st = $("loginStatus");

    btn.disabled = true;
    btn.textContent = "VERIFICANDO...";

    st.className = "status";
    st.textContent = "";

    try{

      const r =
        await jsonp({
          accion:"login",
          usuario:$("loginUsuario").value,
          pin:$("loginPin").value
        });


      if(!r || !r.ok){

        throw new Error(
          r?.error ||
          "Usuario o PIN incorrecto."
        );

      }


      token = r.token;
      vendedor = r.usuario;


      await cargarCatalogo();


      renderConsulta();

    }catch(err){

      st.className = "status error";
      st.textContent = err.message;

      btn.disabled = false;
      btn.textContent = "INGRESAR";

    }

  };

}


/* =========================================================
   CARGA COMPLETA DEL CATÁLOGO
   ========================================================= */

async function cargarCatalogo(){

  mostrarCarga();

  const r =
    await jsonp({
      accion:"catalogo",
      token
    });


  if(!r?.ok){

    throw new Error(
      r?.error ||
      "No se pudo cargar el catálogo."
    );

  }


  catalogoProductos =
    Array.isArray(r.productos)
      ? r.productos
      : (
          Array.isArray(r.catalogo)
            ? r.catalogo
            : []
        );


  construirCatalogo(catalogoProductos);

}


function construirCatalogo(productos){

  catalogoOpciones = [];

  const claves = new Set();


  productos.forEach(p=>{

    const categoria =
      categoriaProducto(p);

    if(categoria === "OTRO"){

      /*
       * En esta primera versión
       * también permitimos OTRO.
       */

    }


    const producto =
      String(p["Producto"] || "").trim();

    const medida =
      String(p["Medida"] || "").trim();


    /*
     * Igual que el catálogo actual:
     * una opción por Producto + Medida.
     * Los colores no duplican el resultado.
     */

    const clave =
      `${categoria}|${producto.toUpperCase()}|${medida.toUpperCase()}`;


    if(claves.has(clave))return;

    claves.add(clave);


    catalogoOpciones.push({
      ...p
    });

  });


  if(!catalogoOpciones.length){

    throw new Error(
      "El catálogo no contiene productos."
    );

  }

}


function mostrarCarga(){

  $("app").innerHTML = `

    <main class="wrap">

      <section class="card loading">

        <img
          class="logo-login"
          src="${LOGO_URL}"
          alt="G&T S.R.L."
        >

        <h1>Cargando productos...</h1>

        <div class="subtitle">
          Preparando el catálogo.
        </div>

        <div class="spinner"></div>

      </section>

    </main>
  `;

}


/* =========================================================
   INTERFAZ DE CONSULTA
   ========================================================= */

function renderConsulta(){

  document.title =
    "G&T S.R.L. — Consulta de Productos";


  $("app").innerHTML = `

    <header>

      <div class="header-inner">

        <img
          src="${LOGO_URL}"
          alt="G&T S.R.L."
        >

        <div class="user-pill">
          Vendedor:
          <strong>${esc(vendedor)}</strong>
        </div>

      </div>

    </header>


    <main class="wrap">

      <div class="catalog-header">

        <h1>Consulta de Productos</h1>

        <div class="subtitle">
          Buscá un producto para consultar sus precios y características.
        </div>

      </div>


      <div class="consulta-grid">

        <!-- =========================
             MÓDULO IZQUIERDO
             ========================= -->

        <section class="consulta-panel">

          <label
            class="search-label"
            for="buscarProducto"
          >
            🔎 BUSCAR PRODUCTO
          </label>


          <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
              id="buscarProducto"
              type="search"
              placeholder="Nombre, medida..."
              autocomplete="off"
            >

          </div>


          <div class="resultados-titulo">

            <span>Resultados</span>

            <span
              id="resultadosCount"
              class="resultados-count"
            ></span>

          </div>


          <div
            id="catalogoLista"
            class="catalogo-lista"
          ></div>

        </section>


        <!-- =========================
             MÓDULO DERECHO
             ========================= -->

        <section class="consulta-panel detalle-panel">

          <div class="detalle-titulo">
            <span>
              <span class="detalle-titulo-icon">▱</span>
              Información del Producto
            </span>
          </div>

          <div
            id="detalleProducto"
            class="detalle-placeholder"
          >
            Seleccioná un producto para ver
            sus precios y características.
          </div>

        </section>

      </div>

    </main>
  `;


  $("buscarProducto").addEventListener(
    "input",
    renderCatalogo
  );


  renderCatalogo();

}


/* =========================================================
   TEXTO DE RESULTADO
   ========================================================= */

function textoOpcionCatalogo(p){

  const producto =
    String(p["Producto"] || "").trim();

  const medida =
    String(p["Medida"] || "").trim();

  const id =
    String(p["ID"] || "").trim();


  if(medida){

    return `${producto} ${medida} ${id}`;

  }

  return `${producto} ${id}`;

}


/* =========================================================
   BUSCADOR
   ========================================================= */

function renderCatalogo(){

  const lista =
    $("catalogoLista");

  if(!lista)return;


  const q =
    String(
      $("buscarProducto")?.value || ""
    )
    .trim()
    .toLocaleLowerCase("es-AR");


  const resultados =
    catalogoOpciones.filter(p=>{

      if(!q)return true;

      return textoOpcionCatalogo(p)
        .toLocaleLowerCase("es-AR")
        .includes(q);

    });


  $("resultadosCount").textContent =
    resultados.length +
    (
      resultados.length === 1
        ? " producto"
        : " productos"
    );


  if(!resultados.length){

    lista.innerHTML = `
      <div class="empty">
        No se encontraron productos.
      </div>
    `;

    return;

  }


  lista.innerHTML =
    resultados.map((p,i)=>{

      const indice =
        catalogoOpciones.indexOf(p);

      const medida =
        String(p["Medida"] || "").trim();

      return `

        <button
          type="button"
          class="catalogo-item"
          data-index="${indice}"
        >

          <div class="catalogo-item-main">

            <strong>
              ${esc(p["Producto"] || "")}
            </strong>

            <span>
              ${esc(medida || "Sin medida")}
            </span>

          </div>

         </button>

      `;

    }).join("");


  lista
    .querySelectorAll("[data-index]")
    .forEach(item=>{

      item.addEventListener(
        "click",
        ()=>{

          seleccionarProducto(
            Number(item.dataset.index)
          );

        }
      );

    });

}


function seleccionarProducto(indice){

  const p =
    catalogoOpciones[indice];

  if(!p)return;

  productoActual = p;

  mostrarProducto(p);

}


/* =========================================================
   DETALLE DEL PRODUCTO
   ========================================================= */

function mostrarProducto(p){

  const detalle =
    $("detalleProducto");

  const categoria =
    categoriaProducto(p);


  const producto =
    String(p["Producto"] || "").trim();

  const medida =
    String(p["Medida"] || "").trim();

  const colorRaw =
    String(p["Color"] || "").trim();

  const precioContado =
    Number(p["Precio Contado"] || 0);

  const precioTarjeta =
    Number(p["Precio Tarjeta"] || 0);

  const oferta =
    Number(p["OFERTA"] || 0);

  const tieneOferta =
    Number.isFinite(oferta) &&
    oferta > 0;

  const cajaM2 =
    Number(p["Caja m²"] || 0);

  const kgCaja =
    Number(p["Kg/Caja"] || 0);


  const colores =
    colorRaw
      .split(/\s*-\s*/)
      .map(c=>c.trim())
      .filter(Boolean);


  let html = `

    <div class="detalle-cabecera">

      <div style="min-width:0">

        <div class="detalle-producto">
          ${esc(producto)}
        </div>

        ${medida ? `
          <div class="detalle-sub">
            Medida: <strong>${esc(medida)}</strong>
          </div>
        ` : ""}

        ${colores.length ? `

          <div class="detalle-sub">
            <strong>Color${colores.length > 1 ? "es" : ""}:</strong>

            <div class="color-lista">

              ${colores.map(c=>`
                <span class="color-tag">
                  ${esc(c)}
                </span>
              `).join("")}

            </div>

          </div>

        ` : ""}

      </div>

      <div class="detalle-categoria">
        ${esc(nombreCategoria(categoria))}
      </div>

    </div>
  `;


  /* =========================
     PRECIOS
     ========================= */

  html += `<div class="precios-grid">`;


  if(precioContado > 0){

    html += `
      <div class="dato dato-precio">

        <span class="dato-label">
          Precio contado
        </span>

        <span class="dato-valor">
          $ ${numero(precioContado)}
          ${categoria === "CRRL" ? "/ unidad" : "/ m²"}
        </span>

      </div>
    `;

  }


  if(tieneOferta){

    html += `
      <div class="dato dato-precio oferta">

        <span class="dato-label">
          Precio oferta
        </span>

        <span class="dato-valor">
          $ ${numero(oferta)}
          ${categoria === "CRRL" ? "/ unidad" : "/ m²"}
        </span>

      </div>
    `;

  }


  if(precioTarjeta > 0){

    html += `
      <div class="dato dato-precio tarjeta">

        <span class="dato-label">
          Precio tarjeta
        </span>

        <span class="dato-valor">
          $ ${numero(precioTarjeta)}
          ${categoria === "CRRL" ? "/ unidad" : "/ m²"}
        </span>

      </div>
    `;

  }


  html += `</div>`;


  /* =========================
     INFORMACIÓN DE CAJA
     Solo mostrar si corresponde
     ========================= */

  const datosCaja = [];


  if(cajaM2 > 0){

    datosCaja.push({
      label:"m² por caja",
      valor:`${numero(cajaM2)} m²`
    });

  }


  if(medida && cajaM2 > 0){

    const partes =
      medida
        .toLowerCase()
        .split("x")
        .map(v =>
          Number(
            String(v)
              .trim()
              .replace(",", ".")
          )
        );


    if(
      partes.length === 2 &&
      Number.isFinite(partes[0]) &&
      Number.isFinite(partes[1]) &&
      partes[0] > 0 &&
      partes[1] > 0
    ){

      const areaPieza =
        (partes[0] / 100) *
        (partes[1] / 100);

      const unidades =
        Math.round(
          cajaM2 / areaPieza
        );


      if(unidades > 0){

        datosCaja.push({
          label:"Cantidad por caja",
          valor:`${numero0(unidades)} unidades`
        });

      }

    }

  }


  /*
   * Precio por caja.
   * Se mantiene como cálculo visual para esta versión:
   * precio contado × m² por caja.
   *
   * No altera ningún dato del catálogo.
   */

  if(cajaM2 > 0 && precioContado > 0){

    datosCaja.unshift({
      label:"Precio por caja",
      valor:`$ ${numero(precioContado * cajaM2)}`
    });

  }


  if(datosCaja.length){

    html += `
      <div class="caja-grid">

        ${datosCaja.map(d=>`

          <div class="caja-dato">

            <span class="dato-label">
              ${esc(d.label)}
            </span>

            <span class="dato-valor">
              ${esc(d.valor)}
            </span>

          </div>

        `).join("")}

      </div>
    `;

  }


  /*
   * Kg/caja solamente si existe y no es necesario
   * ocupar espacio con un campo vacío.
   */

  if(kgCaja > 0){

    html += `
      <div class="nota">
        ${numero(kgCaja)} kg por caja.
      </div>
    `;

  }


  detalle.innerHTML = html;

}


/* =========================================================
   INICIO
   ========================================================= */

mostrarLogin();

</script>
